<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrigtwohill Parish — Historical Places Map</title>
  <meta name="description" content="An interactive map of historical places in Carrigtwohill Parish, Co. Cork." />

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="site-header-text">
      <h1>
        <span class="site-header-full">Carrigtwohill Parish — Historical Places</span>
        <span class="site-header-short">Carrigtwohill Parish</span>
      </h1>
      <p class="tagline">
        <span class="site-header-full">An interactive map of local history</span>
        <span class="site-header-short">Historical places</span>
      </p>
    </div>

    <button type="button" id="drawer-toggle" class="drawer-toggle"
            aria-label="Open map controls" aria-expanded="false" aria-controls="map-controls">
      <i class="ti ti-menu-2" aria-hidden="true"></i>
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>

    <div id="map-controls" class="map-controls" role="region" aria-label="Map controls"></div>
  </header>

  <main>
    <div id="map" role="region" aria-label="Interactive map of historical places"></div>

    <div class="mobile-zoom" role="group" aria-label="Zoom">
      <button type="button" id="mobile-zoom-in" class="control-btn" aria-label="Zoom in">
        <i class="ti ti-plus" aria-hidden="true"></i>
      </button>
      <button type="button" id="mobile-zoom-out" class="control-btn" aria-label="Zoom out">
        <i class="ti ti-minus" aria-hidden="true"></i>
      </button>
    </div>

    <div id="map-loading" class="map-loading" hidden>Loading places…</div>
    <div id="map-error" class="map-error" role="alert" hidden></div>
    <div id="townland-tooltip" class="townland-tooltip" role="tooltip" aria-hidden="true" hidden></div>
  </main>

  <!-- Preview modal -->
  <div id="preview-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="preview-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" tabindex="-1">
      <button type="button" class="modal-close" aria-label="Close preview" data-close>&times;</button>
      <figure class="modal-figure" hidden>
        <img id="preview-image" alt="" />
        <figcaption id="preview-caption"></figcaption>
      </figure>
      <h2 id="preview-title"></h2>
      <p id="preview-text"></p>
      <p class="modal-actions">
        <a id="preview-link" href="#" target="_blank" rel="noopener" class="btn-primary">
          Further Information
          <span aria-hidden="true">↗</span>
        </a>
      </p>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; Carrigtwohill Historical Society. Text and images remain the property of their respective contributors and are reproduced with permission.</p>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
